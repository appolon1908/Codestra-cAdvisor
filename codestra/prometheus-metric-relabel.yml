# Import this list under the Prometheus cAdvisor scrape job's metric_relabel_configs.
# It keeps only fully attributed Codestra containers, maps the approved Docker
# labels to the corporate metric contract, and removes runtime identity labels.

- action: keep
  source_labels: [container_label_codestra_business]
  regex: 'platform|codestra|moneybee|beyvra|breero|larim-a|transportation|booked4seasons|social|klyrow|telnexa|kyqra|restaurant|provisioning'

- action: keep
  source_labels:
    - container_label_codestra_application
    - container_label_codestra_service
    - container_label_codestra_environment
    - container_label_codestra_region
    - container_label_codestra_deployment
    - container_label_codestra_replica
  separator: ';'
  regex: '[a-z0-9][a-z0-9._-]{0,62};[a-z0-9][a-z0-9._-]{0,62};(development|test|staging|production);[a-z0-9][a-z0-9._-]{0,31};[a-zA-Z0-9][a-zA-Z0-9._-]{0,95};[a-zA-Z0-9][a-zA-Z0-9._-]{0,31}'

- action: replace
  source_labels: [container_label_codestra_business]
  target_label: codestra_business
  regex: '(.+)'
  replacement: '$1'

- action: replace
  source_labels: [container_label_codestra_application]
  target_label: application
  regex: '(.+)'
  replacement: '$1'

- action: replace
  source_labels: [container_label_codestra_service]
  target_label: service
  regex: '(.+)'
  replacement: '$1'

- action: replace
  source_labels: [container_label_codestra_environment]
  target_label: environment
  regex: '(.+)'
  replacement: '$1'

- action: replace
  source_labels: [container_label_codestra_region]
  target_label: region
  regex: '(.+)'
  replacement: '$1'

- action: replace
  source_labels: [container_label_codestra_deployment]
  target_label: deployment
  regex: '(.+)'
  replacement: '$1'

- action: replace
  source_labels: [container_label_codestra_replica]
  target_label: replica
  regex: '(.+)'
  replacement: '$1'

- action: labeldrop
  regex: 'container_label_.*'

- action: labeldrop
  regex: 'container_env_.*'

- action: labeldrop
  regex: 'id|name|image|container|container_id|container_name|image_id|image_digest|pod|pod_uid|namespace'
