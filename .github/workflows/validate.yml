name: Validate Codestra cAdvisor source authority

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codestra-cadvisor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Install pinned parser
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Classify an exact upstream-pin bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ && "${{ github.event.before }}" != '0000000000000000000000000000000000000000' ]]; then
            base_sha="${{ github.event.before }}"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            base_sha="$(git merge-base refs/remotes/origin/main "$GITHUB_SHA")"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          else
            echo 'Unsupported validation event for base selection.' >&2
            exit 2
          fi
          mapfile -t refs < <(python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          lock = json.loads(Path('CODESTRA_UPSTREAM_LOCK.json').read_text())
          print(source.get('upstream_ref', ''))
          print(lock.get('upstream_commit', ''))
          PY
          )
          pending=0
          if [[ "${refs[0]}" != "${refs[1]}" ]]; then
            [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]
            mapfile -t changed < <(git diff --name-only "$base_sha" "$GITHUB_SHA")
            (( ${#changed[@]} == 1 ))
            [[ "${changed[0]}" == CODESTRA_UPSTREAM.json ]]
            pending=1
          fi
          echo "CADVISOR_PENDING_SYNC=${pending}" >> "$GITHUB_ENV"
          echo "CADVISOR_VALIDATION_BASE_SHA=${base_sha}" >> "$GITHUB_ENV"

      - name: Validate protected source controls
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-cadvisor-pycache
        run: |
          python -m py_compile scripts/validate_repository_security.py tests/test_repository_security.py tests/test_repository_security_remote_writes.py
          python tests/test_repository_security.py
          python tests/test_repository_security_remote_writes.py
          validator_args=()
          if [[ "$CADVISOR_PENDING_SYNC" == 1 ]]; then
            validator_args+=(--allow-exact-pin-bootstrap)
          fi
          python scripts/validate_repository_security.py "${validator_args[@]}"

      - name: Bind vendored Git tree to exact official commit
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t refs < <(python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          lock = json.loads(Path('CODESTRA_UPSTREAM_LOCK.json').read_text())
          print(source['upstream_ref'])
          print(lock['upstream_commit'])
          PY
          )
          upstream_ref="${refs[0]}"
          locked_upstream_ref="${refs[1]}"
          [[ "$upstream_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$locked_upstream_ref" =~ ^[0-9a-f]{40}$ ]]
          validation_ref="$upstream_ref"
          if [[ "$CADVISOR_PENDING_SYNC" == 1 ]]; then
            validation_ref="$locked_upstream_ref"
          else
            [[ "$upstream_ref" == "$locked_upstream_ref" ]]
          fi
          staging="$(mktemp -d)"
          trap 'rm -rf -- "$staging"' EXIT
          git init --quiet "$staging/source"
          git -C "$staging/source" remote add origin https://github.com/google/cadvisor.git
          GIT_LFS_SKIP_SMUDGE=1 git -C "$staging/source" fetch --depth 1 --no-tags origin "$upstream_ref"
          [[ "$(git -C "$staging/source" rev-parse FETCH_HEAD)" == "$upstream_ref" ]]
          if [[ "$validation_ref" != "$upstream_ref" ]]; then
            GIT_LFS_SKIP_SMUDGE=1 git -C "$staging/source" fetch --depth 1 --no-tags origin "$validation_ref"
          fi
          git -C "$staging/source" checkout --quiet --detach "$validation_ref"
          [[ "$(git -C "$staging/source" rev-parse HEAD)" == "$validation_ref" ]]
          official_tree="$(git -C "$staging/source" rev-parse 'HEAD^{tree}')"
          vendored_tree="$(git rev-parse 'HEAD:upstream')"
          [[ "$vendored_tree" == "$official_tree" ]]

      - name: Reject control-plane secrets and whitespace errors
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -RIlE --exclude-dir=.git --exclude-dir=upstream --exclude-dir=tests \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~-]{16,}|client_secret[[:space:]]*=[[:space:]]*[^[:space:]<]+)' .
          base_sha="$CADVISOR_VALIDATION_BASE_SHA"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --check "$base_sha" "$GITHUB_SHA" -- . ':(exclude)upstream'
