name: Validate Codestra production server API contract

on:
  pull_request:
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml
  push:
    branches: [development, test, staging, production, main]
    paths:
      - docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md
      - .github/workflows/validate-production-server-api-contract.yml

permissions:
  contents: read

concurrency:
  group: cadvisor-production-api-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate source-only production contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/CODESTRA_PRODUCTION_SERVER_API_CONTRACT.md').read_text(encoding='utf-8')
          required = [
              'appolon1908-hue/Codestra-cAdvisor', '37.27.128.39', '65.109.65.169',
              'SOURCE_CONTRACT_PREPARED_NOT_DEPLOYED', '`GET`, `HEAD` | `/healthz',
              '`GET`, `HEAD` | `/metrics', 'DOCKER_WRITE_AUTHORITY=NO',
              'PRIVILEGED_MODE=NO', 'METHOD_ALLOWLIST_GET_HEAD=PASS',
              'HEALTHZ_EXTERNAL_MTLS=PASS', 'METRICS_EXTERNAL_MTLS=PASS',
              'NATIVE_BASE_IDENTITY_LABELS_PRIVATE=PASS',
              'PROMETHEUS_METRIC_RELABEL=PASS', 'HEAD_/healthz=PASS',
              'HEAD_/metrics=PASS', 'UNAUTHENTICATED_HEALTHZ_DENIED=PASS',
              'NATIVE_ID_NAME_IMAGE_LABELS_PRIVATE=PASS',
              'POST_PROMETHEUS_RELABEL_SENSITIVE_IDENTITY_LABELS=0',
              'POST_PROMETHEUS_RELABEL_HIGH_CARDINALITY_LABELS=0',
              'UNEXPECTED_404=0', 'SOURCE_RUNTIME_DRIFT=0',
              'This document does not deploy cAdvisor',
          ]
          missing = [value for value in required if value not in text]
          assert not missing, f'missing production API contract controls: {missing}'
          forbidden = [
              'SENSITIVE_LABELS=0',
              'Customer IDs, users, emails, phones, requests, traces, messages, orders, payments, transaction IDs, container IDs, image IDs, and pod UIDs are not exported as metric labels.',
              'ADMIN_BYPASS_AUTHORIZED=YES',
              'SSH_CONFIGURATION_CHANGES_AUTHORIZED=YES',
              ':latest',
          ]
          present = [value for value in forbidden if value in text]
          assert not present, f'forbidden or misleading production contract claims: {present}'
          print('CODESTRA_CADVISOR_PRODUCTION_API_CONTRACT=PASS')
          PY
